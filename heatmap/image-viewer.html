<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地图片查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2a2a2a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #4ade80;
        }

        .upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border: 3px dashed #444;
            margin: 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #4ade80;
            background: #1f291f;
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #4ade80;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: #666;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-container.active {
            display: flex;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
        }

        .preview-image {
            max-width: 95vw;
            max-height: calc(100vh - 120px);
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out;
            transform-origin: 0 0;
            display: block;
            cursor: grab;
        }

        .preview-image:active {
            cursor: grabbing;
        }

        .hex-grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
            cursor: crosshair;
        }

        .hex-grid-overlay.active {
            display: block;
        }

        .preview-info {
            margin-top: 15px;
            text-align: center;
            color: #888;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(42, 42, 42, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 1001;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            background: #4ade80;
            color: #1a1a1a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        .control-btn.active {
            background: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .nav-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.3s ease;
        }

        .nav-btn:hover {
            background: #3a3a3a;
        }

        .nav-btn:disabled {
            color: #444;
            cursor: not-allowed;
        }

        .counter {
            color: #888;
            font-size: 0.9rem;
            min-width: 60px;
            text-align: center;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 15px;
            padding-left: 15px;
            border-left: 1px solid #444;
        }

        .zoom-display {
            color: #fff;
            font-size: 0.85rem;
            min-width: 45px;
            text-align: center;
        }

        .zoom-btn {
            background: #3a3a3a;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .zoom-btn:hover {
            background: #4a4a4a;
        }

        .zoom-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .grid-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 15px;
            padding-left: 15px;
            border-left: 1px solid #444;
        }

        .grid-btn {
            background: #3a3a3a;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .grid-btn:hover {
            background: #4a4a4a;
        }

        .grid-btn.active {
            background: #4ade80;
            color: #1a1a1a;
        }

        .coord-btn {
            background: #3a3a3a;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .coord-btn:hover {
            background: #4a4a4a;
        }

        .coord-btn.active {
            background: #4ade80;
            color: #1a1a1a;
        }

        .export-btn {
            background: #60a5fa;
            color: #1a1a1a;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📷 本地图片查看器</h1>
    </div>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击选择图片或拖放图片到这里</div>
        <div class="upload-hint">支持 JPG、PNG、GIF、WEBP 等格式</div>
    </div>

    <input type="file" id="fileInput" accept="image/*" multiple>

    <div class="preview-container" id="previewContainer">
        <div class="controls">
            <button class="nav-btn" id="prevBtn" disabled>◀</button>
            <span class="counter" id="counter">0 / 0</span>
            <button class="nav-btn" id="nextBtn" disabled>▶</button>
            <button class="control-btn" id="uploadMoreBtn">📁 添加更多</button>
            <button class="control-btn" id="resetBtn">🔄 重置</button>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomOutBtn" title="缩小">−</button>
                <span class="zoom-display" id="zoomDisplay">100%</span>
                <button class="zoom-btn" id="zoomInBtn" title="放大">+</button>
                <button class="zoom-btn" id="zoomResetBtn" title="重置缩放">1:1</button>
            </div>
            <div class="grid-controls">
                <button class="grid-btn" id="gridBtn" title="显示/隐藏网格">⬡ 网格化</button>
                <button class="coord-btn" id="coordBtn" title="显示/隐藏坐标">📍 坐标</button>
                <button class="export-btn" id="exportBtn" title="导出坐标数据">📤 导出</button>
            </div>
        </div>
        <div class="image-wrapper" id="imageWrapper">
            <img class="preview-image" id="previewImage" src="" alt="预览图片">
            <canvas class="hex-grid-overlay" id="hexGridCanvas"></canvas>
        </div>
        <div class="preview-info" id="previewInfo"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const previewInfo = document.getElementById('previewInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const uploadMoreBtn = document.getElementById('uploadMoreBtn');
        const resetBtn = document.getElementById('resetBtn');
        const counter = document.getElementById('counter');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomResetBtn = document.getElementById('zoomResetBtn');
        const zoomDisplay = document.getElementById('zoomDisplay');
        const gridBtn = document.getElementById('gridBtn');
        const coordBtn = document.getElementById('coordBtn');
        const exportBtn = document.getElementById('exportBtn');
        const imageWrapper = document.getElementById('imageWrapper');
        const hexGridCanvas = document.getElementById('hexGridCanvas');

        let loadedFiles = [];
        let currentIndex = -1;
        let currentZoom = 1.0;
        const zoomStep = 0.25;
        const minZoom = 0.1;
        const maxZoom = 10.0;
        let gridEnabled = false;
        let coordEnabled = false;
        const hexSize = 120; // 六边形半径
        let gridCoordinates = []; // 存储所有网格的坐标数据
        let selectedGridIds = new Set(); // 当前选中的网格ID集合（多选）

        // 框选相关变量
        let isSelecting = false;
        let selectionStartX = 0;
        let selectionStartY = 0;
        let selectionEndX = 0;
        let selectionEndY = 0;

        // 拖拽相关变量
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let panX = 0;
        let panY = 0;

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择处理
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 拖放处理
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // 添加更多按钮
        uploadMoreBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        // 重置按钮
        resetBtn.addEventListener('click', () => {
            loadedFiles = [];
            currentIndex = -1;
            previewContainer.classList.remove('active');
            previewImage.src = '';
            uploadArea.style.display = 'flex';
        });

        // 导航按钮
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                showPreview(currentIndex - 1);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < loadedFiles.length - 1) {
                showPreview(currentIndex + 1);
            }
        });

        // 缩放按钮
        zoomOutBtn.addEventListener('click', zoomOut);
        zoomInBtn.addEventListener('click', zoomIn);
        zoomResetBtn.addEventListener('click', resetZoom);

        // 网格按钮
        gridBtn.addEventListener('click', toggleGrid);
        // 坐标按钮
        coordBtn.addEventListener('click', toggleCoord);
        // 导出按钮
        exportBtn.addEventListener('click', exportCoordinates);

        // 网格鼠标事件 - 点击和框选
        hexGridCanvas.addEventListener('mousedown', handleGridMouseDown);
        hexGridCanvas.addEventListener('mousemove', handleGridMouseMove);
        hexGridCanvas.addEventListener('mouseup', handleGridMouseUp);
        hexGridCanvas.addEventListener('mouseleave', handleGridMouseUp);

        // 鼠标滚轮缩放
        previewContainer.addEventListener('wheel', (e) => {
            if (!previewContainer.classList.contains('active')) return;
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }
        });

        // 拖拽功能 - 左键按下开始拖拽
        imageWrapper.addEventListener('mousedown', (e) => {
            if (!previewContainer.classList.contains('active')) return;
            // 只在左键按下时允许拖拽
            if (e.button !== 0) return;
            // 只在缩放大于1时允许拖拽
            if (currentZoom <= 1.0) return;
            // 只在图片上点击时才允许拖拽（网格层点击用于选择网格）
            if (e.target !== previewImage) return;

            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            e.preventDefault();
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            applyTransform();
        });

        // 松开鼠标停止拖拽
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
            }
        });

        // 键盘导航
        document.addEventListener('keydown', (e) => {
            if (!previewContainer.classList.contains('active')) return;

            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                showPreview(currentIndex - 1);
            } else if (e.key === 'ArrowRight' && currentIndex < loadedFiles.length - 1) {
                showPreview(currentIndex + 1);
            } else if (e.key === '+' || e.key === '=') {
                zoomIn();
            } else if (e.key === '-' || e.key === '_') {
                zoomOut();
            } else if (e.key === '0') {
                resetZoom();
            } else if (e.key === 'g' || e.key === 'G') {
                toggleGrid();
            }
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const fileData = {
                            name: file.name,
                            size: file.size,
                            dataUrl: e.target.result
                        };
                        loadedFiles.push(fileData);

                        // 如果是第一张图片，直接显示
                        if (loadedFiles.length === 1) {
                            showPreview(0);
                        } else {
                            updateCounter();
                            updateNavButtons();
                        }
                    };
                    reader.readAsDataURL(file);
                } else {
                    alert(`"${file.name}" 不是图片文件`);
                }
            });
        }

        function showPreview(index) {
            if (index < 0 || index >= loadedFiles.length) return;

            currentIndex = index;
            const file = loadedFiles[index];

            // 重置选中状态
            selectedGridIds.clear();

            previewImage.src = file.dataUrl;
            previewInfo.textContent = `${file.name} - ${formatSize(file.size)}`;
            previewContainer.classList.add('active');
            uploadArea.style.display = 'none';

            updateCounter();
            updateNavButtons();

            // 图片加载完成后重置缩放并绘制网格
            previewImage.onload = () => {
                resetZoom();

                if (gridEnabled) {
                    drawHexGrid();
                }
            };
        }

        function updateCounter() {
            counter.textContent = `${currentIndex + 1} / ${loadedFiles.length}`;
        }

        function updateNavButtons() {
            prevBtn.disabled = currentIndex <= 0;
            nextBtn.disabled = currentIndex >= loadedFiles.length - 1;
        }

        function zoomIn() {
            if (currentZoom < maxZoom) {
                currentZoom = Math.min(currentZoom + zoomStep, maxZoom);
                applyTransform();
                updateZoomDisplay();
                updateZoomButtons();
            }
        }

        function zoomOut() {
            if (currentZoom > minZoom) {
                currentZoom = Math.max(currentZoom - zoomStep, minZoom);
                // 缩放小于等于1时重置拖拽位置
                if (currentZoom <= 1.0) {
                    resetPan();
                }
                applyTransform();
                updateZoomDisplay();
                updateZoomButtons();
            }
        }

        function resetZoom() {
            currentZoom = 1.0;
            resetPan();
            applyTransform();
            updateZoomDisplay();
            updateZoomButtons();
        }

        function resetPan() {
            panX = 0;
            panY = 0;
        }

        function updateZoomDisplay() {
            zoomDisplay.textContent = Math.round(currentZoom * 100) + '%';
        }

        function applyTransform() {
            const transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
            previewImage.style.transform = transform;
            hexGridCanvas.style.transform = transform;
        }

        function updateZoomButtons() {
            zoomOutBtn.disabled = currentZoom <= minZoom;
            zoomInBtn.disabled = currentZoom >= maxZoom;
        }

        function toggleGrid() {
            gridEnabled = !gridEnabled;
            gridBtn.classList.toggle('active', gridEnabled);

            if (gridEnabled) {
                hexGridCanvas.classList.add('active');
                drawHexGrid();
            } else {
                hexGridCanvas.classList.remove('active');
            }
        }

        function toggleCoord() {
            coordEnabled = !coordEnabled;
            coordBtn.classList.toggle('active', coordEnabled);

            if (gridEnabled) {
                drawHexGrid();
            }
        }

        function exportCoordinates() {
            if (gridCoordinates.length === 0) {
                alert('请先开启网格化以生成坐标数据');
                return;
            }

            const dataStr = JSON.stringify(gridCoordinates, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'grid-coordinates.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function drawHexGrid() {
            // 清空坐标数据
            gridCoordinates = [];

            // 获取图片的显示尺寸
            let displayWidth = previewImage.offsetWidth || previewImage.clientWidth;
            let displayHeight = previewImage.offsetHeight || previewImage.clientHeight;
            const naturalWidth = previewImage.naturalWidth;
            const naturalHeight = previewImage.naturalHeight;

            // 如果还没有显示尺寸，使用 naturalWidth/naturalHeight 计算
            if (displayWidth === 0 || displayHeight === 0) {
                // 计算图片适应屏幕的尺寸
                const maxWidth = window.innerWidth * 0.95;
                const maxHeight = window.innerHeight - 120;
                const scale = Math.min(maxWidth / naturalWidth, maxHeight / naturalHeight, 1.0);
                displayWidth = naturalWidth * scale;
                displayHeight = naturalHeight * scale;
            }

            if (displayWidth === 0 || displayHeight === 0) return;

            // 设置 Canvas 的实际尺寸和显示尺寸都匹配图片的显示尺寸
            hexGridCanvas.width = displayWidth;
            hexGridCanvas.height = displayHeight;
            hexGridCanvas.style.width = displayWidth + 'px';
            hexGridCanvas.style.height = displayHeight + 'px';

            const ctx = hexGridCanvas.getContext('2d');
            ctx.clearRect(0, 0, displayWidth, displayHeight);

            // 计算缩放比例 - 六边形大小需要根据图片缩放比例调整
            const imageScale = displayWidth / naturalWidth;

            // 六边形尺寸计算 - 根据图片缩放比例调整
            const r = hexSize * imageScale; // 中心到顶点的距离
            const xDist = r * Math.sqrt(3); // 水平间距
            const yDist = r * 1.5; // 垂直间距

            // 绘制六边形网格
            const cols = Math.ceil(displayWidth / xDist) + 2;
            const rows = Math.ceil(displayHeight / yDist) + 2;

            for (let row = -1; row < rows; row++) {
                for (let col = -1; col < cols; col++) {
                    // 奇数行向右偏移一半水平间距
                    const centerX = col * xDist + (row % 2 === 1 ? xDist / 2 : 0);
                    const centerY = row * yDist;

                    // 只绘制与图片区域有重叠的六边形
                    if (centerX + r < 0 || centerX - r > displayWidth ||
                        centerY + r < 0 || centerY - r > displayHeight) {
                        continue;
                    }

                    // 计算坐标 - 原点在右下角，第一象限
                    // 图片右下角为 (0, 0)，向左为 x 轴正方向，向上为 y 轴正方向
                    // 坐标使用自然尺寸（不是显示尺寸）
                    const naturalCenterX = centerX / imageScale;
                    const naturalCenterY = centerY / imageScale;
                    const coordX = naturalWidth - naturalCenterX;
                    const coordY = naturalHeight - naturalCenterY;

                    const gridId = `${row}_${col}`;
                    const isHighlighted = selectedGridIds.has(gridId);

                    // 保存坐标数据
                    gridCoordinates.push({
                        gridId: gridId,
                        row: row,
                        col: col,
                        x: coordX,
                        y: coordY,
                        centerXNatural: naturalCenterX,
                        centerYNatural: naturalCenterY,
                        hexSizeNatural: hexSize
                    });

                    // 绘制六边形（带高亮）
                    drawHexagon(ctx, centerX, centerY, r, isHighlighted);

                    // 如果开启了坐标显示，绘制坐标标签
                    if (coordEnabled) {
                        ctx.fillStyle = isHighlighted ? 'rgba(255, 255, 255, 1)' : 'rgba(255, 255, 255, 0.9)';
                        ctx.font = `${Math.max(10, r / 3)}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const label = `(${Math.round(coordX)}, ${Math.round(coordY)})`;
                        ctx.fillText(label, centerX, centerY);
                    }
                }
            }

            // 绘制选择框
            if (isSelecting) {
                const selLeft = Math.min(selectionStartX, selectionEndX);
                const selTop = Math.min(selectionStartY, selectionEndY);
                const selWidth = Math.abs(selectionEndX - selectionStartX);
                const selHeight = Math.abs(selectionEndY - selectionStartY);

                // 绘制半透明填充
                ctx.fillStyle = 'rgba(74, 222, 128, 0.15)';
                ctx.fillRect(selLeft, selTop, selWidth, selHeight);

                // 绘制边框
                ctx.strokeStyle = 'rgba(74, 222, 128, 0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(selLeft, selTop, selWidth, selHeight);
                ctx.setLineDash([]);
            }
        }

        function drawHexagon(ctx, centerX, centerY, size, isHighlighted = false) {
            ctx.beginPath();
            // 六边形顶点，从-30度开始（尖顶朝上）
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6;
                const x = centerX + size * Math.cos(angle);
                const y = centerY + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();

            if (isHighlighted) {
                // 高亮样式：填充+边框
                ctx.fillStyle = 'rgba(74, 222, 128, 0.3)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(74, 222, 128, 1)';
                ctx.lineWidth = 2;
            } else {
                // 普通样式：只有边框
                ctx.strokeStyle = 'rgba(74, 222, 128, 0.5)';
                ctx.lineWidth = 1;
            }
            ctx.stroke();
        }

        // 判断点是否在六边形内
        function isPointInHexagon(px, py, centerX, centerY, size) {
            const dx = Math.abs(px - centerX);
            const dy = Math.abs(py - centerY);
            const size3_2 = size * Math.sqrt(3) / 2;

            // 快速排除
            if (dx > size || dy > size3_2) return false;

            // 六边形内判断
            return (size3_2 * dx + size * dy / 2) <= size * size3_2;
        }

        // 获取网格在画布上的中心坐标
        function getGridDisplayCenter(grid, imageScale) {
            const r = hexSize * imageScale;
            const xDist = r * Math.sqrt(3);
            const yDist = r * 1.5;
            return {
                x: grid.col * xDist + (grid.row % 2 === 1 ? xDist / 2 : 0),
                y: grid.row * yDist
            };
        }

        // 判断网格是否与矩形区域相交（简化的AABB检测）
        function isGridInRectangle(grid, rectLeft, rectTop, rectRight, rectBottom, imageScale) {
            const r = hexSize * imageScale;
            const center = getGridDisplayCenter(grid, imageScale);

            // 使用六边形外接矩形进行AABB检测
            const hexLeft = center.x - r;
            const hexRight = center.x + r;
            const hexTop = center.y - r * Math.sqrt(3) / 2;
            const hexBottom = center.y + r * Math.sqrt(3) / 2;

            return !(hexRight < rectLeft || hexLeft > rectRight ||
                     hexBottom < rectTop || hexTop > rectBottom);
        }

        // 处理网格鼠标按下
        function handleGridMouseDown(e) {
            if (!gridEnabled) return;
            if (e.button !== 0) return; // 只处理左键

            const rect = hexGridCanvas.getBoundingClientRect();
            selectionStartX = e.clientX - rect.left;
            selectionStartY = e.clientY - rect.top;
            selectionEndX = selectionStartX;
            selectionEndY = selectionStartY;
            isSelecting = true;

            // 如果没有按 Ctrl/Cmd，先清空选中
            if (!e.ctrlKey && !e.metaKey) {
                selectedGridIds.clear();
            }
        }

        // 处理网格鼠标移动
        function handleGridMouseMove(e) {
            if (!isSelecting || !gridEnabled) return;

            const rect = hexGridCanvas.getBoundingClientRect();
            selectionEndX = e.clientX - rect.left;
            selectionEndY = e.clientY - rect.top;

            drawHexGrid(); // 重绘以显示选择框
        }

        // 处理网格鼠标抬起
        function handleGridMouseUp(e) {
            if (!isSelecting || !gridEnabled) return;

            const rect = hexGridCanvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            const dx = Math.abs(endX - selectionStartX);
            const dy = Math.abs(endY - selectionStartY);

            // 计算缩放和偏移的反向变换
            const displayWidth = previewImage.offsetWidth || previewImage.clientWidth;
            const naturalWidth = previewImage.naturalWidth;
            const imageScale = displayWidth / naturalWidth;
            const r = hexSize * imageScale;

            if (dx < 5 && dy < 5) {
                // 点击操作（移动距离太小）
                handleSingleGridClick(endX, endY, imageScale, r, e.ctrlKey || e.metaKey || e.shiftKey);
            } else {
                // 框选操作
                const left = Math.min(selectionStartX, endX);
                const top = Math.min(selectionStartY, endY);
                const right = Math.max(selectionStartX, endX);
                const bottom = Math.max(selectionStartY, endY);

                handleRectangleSelection(left, top, right, bottom, imageScale, e.ctrlKey || e.metaKey || e.shiftKey);
            }

            isSelecting = false;
            drawHexGrid(); // 重绘以更新高亮
        }

        // 处理单个网格点击
        function handleSingleGridClick(clickX, clickY, imageScale, r, isMultiSelect) {
            const xDist = r * Math.sqrt(3);
            const yDist = r * 1.5;

            // 查找点击的网格
            let foundGrid = null;
            for (const grid of gridCoordinates) {
                const center = getGridDisplayCenter(grid, imageScale);

                if (isPointInHexagon(clickX, clickY, center.x, center.y, r)) {
                    foundGrid = grid;
                    break;
                }
            }

            // 切换选中状态
            if (foundGrid) {
                if (selectedGridIds.has(foundGrid.gridId)) {
                    if (isMultiSelect) {
                        selectedGridIds.delete(foundGrid.gridId); // Ctrl+点击取消选中
                    } else {
                        selectedGridIds.clear();
                        selectedGridIds.add(foundGrid.gridId);
                    }
                } else {
                    if (!isMultiSelect) {
                        selectedGridIds.clear();
                    }
                    selectedGridIds.add(foundGrid.gridId); // 选中新网格
                }
            } else if (!isMultiSelect) {
                selectedGridIds.clear(); // 点击空白处取消全部选中
            }
        }

        // 处理矩形框选
        function handleRectangleSelection(left, top, right, bottom, imageScale, isAdditive) {
            if (!isAdditive) {
                selectedGridIds.clear();
            }

            for (const grid of gridCoordinates) {
                if (isGridInRectangle(grid, left, top, right, bottom, imageScale)) {
                    selectedGridIds.add(grid.gridId);
                }
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
    </script>
</body>
